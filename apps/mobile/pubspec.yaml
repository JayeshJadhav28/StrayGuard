name: strayguard

description: "StrayGuard Mobile — AI Dashcam & ISA System for Stray Animal Road Safety"

publish_to: 'none'

version: 3.0.0+1

environment:
  sdk: '>=3.9.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  intl: ^0.19.0

  # NETWORK
  http: ^1.2.0

  # WINDOWS WEBVIEW
  webview_windows: ^0.4.0

  # ANDROID WEBVIEW
  webview_flutter: ^4.7.0

  # REAL MAP SYSTEM
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  flutter_map_cancellable_tile_provider: ^3.0.0

  # SEARCH AUTOCOMPLETE
  flutter_typeahead: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true