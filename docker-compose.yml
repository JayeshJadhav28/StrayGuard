version: '3.9'

services:
  db:
    # Use a widely available PostGIS tag for better compatibility
    image: postgis/postgis:15-3.3
    container_name: strayguard_db
    environment:
      POSTGRES_USER: strayguard
      POSTGRES_PASSWORD: dev_password_2024
      POSTGRES_DB: strayguard_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strayguard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
